name: build

# Pull requests build and test. Pushes to main, the monthly run and manual runs also publish
# to GHCR, then one job mirrors to Docker Hub image by image, to stay within its rate limits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Needs the variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN; GHCR uses GITHUB_TOKEN.
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/tcl
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  generated:
    name: Dockerfiles match templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./apply-templates.sh && git diff --exit-code

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.m.outputs.builds }}
      month: ${{ steps.m.outputs.month }}
      tags: ${{ steps.m.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          # Once per run; a new value reruns the Rocky OS update.
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          images=$(jq -c '[.variants as $vars | .versions | keys[] as $v | $vars | to_entries[]
            | {version: $v, variant: .key, dev: (.value.dev // false)}]' versions.json)
          # A build job per image and arch, a tag job per published image.
          builds=$(jq -c '[.[] as $i | ({arch: "amd64", runner: "ubuntu-24.04"}, {arch: "arm64", runner: "ubuntu-24.04-arm"}) | $i + .]' <<<"$images")
          tags=$(jq -c '[.[] | {version, variant, target: "runtime"}, (select(.dev) | {version, variant, target: "dev"})]' <<<"$images")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: [generated, matrix]
    name: ${{ matrix.version }}-${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
      ARCH: ${{ matrix.arch }}
      SCOPE: ${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
      # No Docker Hub pulls: Debian and Alpine via mirror.gcr.io, Rocky from quay.io.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # GHCR names must be lower case.
      - name: GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcl" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull: a new base image changes the cache key, so updates are never skipped.
      - name: Build runtime
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          build-args: UPDATE_MONTH=${{ needs.matrix.outputs.month }}
          pull: true
          load: true
          tags: tcl-test
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}
      - name: Test runtime
        run: ./test.sh tcl-test "$VERSION"

      # Reuses the dev stage the runtime image is built from, so no second compile.
      - name: Build dev
        if: matrix.dev
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          build-args: UPDATE_MONTH=${{ needs.matrix.outputs.month }}
          target: dev
          load: true
          tags: tcl-test-dev
          cache-from: type=gha,scope=${{ env.SCOPE }}
      - name: Test dev
        if: matrix.dev
        run: TARGET=dev ./test.sh tcl-test-dev "$VERSION"

      # The tested images again (cache hits), pushed untagged; the tag job names them.
      - name: Push runtime by digest
        id: push-runtime
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          build-args: UPDATE_MONTH=${{ needs.matrix.outputs.month }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
      - name: Push dev by digest
        id: push-dev
        if: env.PUBLISH == 'true' && matrix.dev
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          build-args: UPDATE_MONTH=${{ needs.matrix.outputs.month }}
          target: dev
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
      - name: Record digests
        if: env.PUBLISH == 'true'
        env:
          RUNTIME_DIGEST: ${{ steps.push-runtime.outputs.digest }}
          DEV_DIGEST: ${{ steps.push-dev.outputs.digest }}
        run: |
          mkdir -p digests/runtime digests/dev
          touch "digests/runtime/${RUNTIME_DIGEST#sha256:}"
          if [ -n "$DEV_DIGEST" ]; then touch "digests/dev/${DEV_DIGEST#sha256:}"; fi
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.variant }}-runtime-${{ matrix.arch }}
          path: digests/runtime/*
      - if: env.PUBLISH == 'true' && matrix.dev
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.variant }}-dev-${{ matrix.arch }}
          path: digests/dev/*

  merge:
    needs: [matrix, build]
    # Also after partial failures: images with both arches still get tagged.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    name: tag ${{ matrix.version }}-${{ matrix.variant }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.tags) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.target }}-*
          merge-multiple: true
      - name: Require both architectures
        run: test "$(ls digests | wc -l)" -eq 2
      - name: GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcl" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner's docker CLI, not BuildKit, so the GHCR login applies.
      - name: Create multi-arch tags
        run: |
          tags=$(./tags.sh "$VERSION" "$VARIANT" "$TARGET")
          targets=""
          for t in $tags; do targets="$targets -t $GHCR_IMAGE:$t"; done
          docker buildx imagetools create --builder default $targets $(printf "$GHCR_IMAGE@sha256:%s " $(ls digests))
          docker buildx imagetools inspect --builder default "$GHCR_IMAGE:${tags%% *}"

  dockerhub:
    needs: [matrix, merge]
    # Also after partial failures; skipped without a Docker Hub account.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGES: ${{ needs.matrix.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcl" >> "$GITHUB_ENV"
      # skopeo sends the credentials on every request; imagetools did not and hit the shared IP limit.
      # --all --preserve-digests keeps the multi-arch index and digests identical to GHCR.
      - name: Mirror GHCR to Docker Hub
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          failed=""
          while read -r version variant target; do
            tags=$(./tags.sh "$version" "$variant" "$target")
            source="docker://$GHCR_IMAGE:${tags%% *}"
            echo "::group::$source"
            for t in $tags; do
              ok=""
              for attempt in 1 2 3; do
                if skopeo copy --all --preserve-digests --retry-times 3 \
                     --src-creds "$GITHUB_ACTOR:$GHCR_TOKEN" --dest-creds "$HUB_USER:$HUB_TOKEN" \
                     "$source" "docker://$IMAGE:$t"; then ok=1; break; fi
                [ "$attempt" = 3 ] || { echo "attempt $attempt failed, retrying in 2 minutes"; sleep 120; }
              done
              [ -n "$ok" ] || failed="$failed $t"
            done
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.version) \(.variant) \(.target)"' <<<"$IMAGES")
          if [ -n "$failed" ]; then echo "not mirrored:$failed" >&2; exit 1; fi

name: build

# Pull requests build and test only. Pushes to main, the monthly rebuild (base image fixes)
# and v* tags also publish to Docker Hub and GHCR; v* tags additionally create a GitHub Release
# with portable tarballs (glibc from the Rocky 8 builds, musl from the Alpine builds).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (a Docker Hub access token);
  # GHCR needs nothing extra: GITHUB_TOKEN pushes to ghcr.io/<owner>/tcl (GHCR_IMAGE, set per job)
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/tcl
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  generated:
    name: Dockerfiles match templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./apply-templates.sh && git diff --exit-code

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.m.outputs.images }}
      builds: ${{ steps.m.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          images=$(jq -c '[.variants as $vars | .versions | keys[] as $v
            | $vars | to_entries[] | {version: $v, variant: .key, libc: (.value.libc // "")}]' versions.json)
          builds=$(jq -c '[.[] as $i | ({arch: "amd64", runner: "ubuntu-24.04"}, {arch: "arm64", runner: "ubuntu-24.04-arm"}) | $i + .]' <<<"$images")
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: [generated, matrix]
    name: ${{ matrix.version }}-${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
      ARCH: ${{ matrix.arch }}
      LIBC: ${{ matrix.libc }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # GHCR names must be lower case; GitHub owner names may not be
      - name: GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcl" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --pull makes a new base image (e.g. the monthly security update) change the cache key,
      # so the GitHub Actions layer cache only skips compiles that would produce the same result
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          pull: true
          load: true
          tags: tcl-test
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Test
        run: ./test.sh tcl-test "$VERSION"

      - name: Package tarball
        if: matrix.libc != ''
        run: |
          name="tcl-$VERSION-linux-$ARCH-$LIBC"
          id=$(docker create tcl-test)
          docker cp "$id:/usr/local" "$name"
          docker rm "$id"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: matrix.libc != ''
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.version }}-${{ matrix.arch }}-${{ matrix.libc }}
          path: tcl-*.tar.gz*

      # the tested image again (cache hit), pushed untagged to both registries; the merge job tags the arch pair
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}/${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*

  merge:
    needs: [matrix, build]
    # also after a partial failure: every image whose two arch builds both passed still gets tagged
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    name: tag ${{ matrix.version }}-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-${{ matrix.version }}-${{ matrix.variant }}-*
          merge-multiple: true
      - name: Require both architectures
        run: test "$(ls digests | wc -l)" -eq 2
      - uses: docker/setup-buildx-action@v4
      # GHCR names must be lower case; GitHub owner names may not be
      - name: GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcl" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          tags=$(./tags.sh "$VERSION" "$VARIANT")
          targets=""
          for t in $tags; do targets="$targets -t $IMAGE:$t -t $GHCR_IMAGE:$t"; done
          # the per-arch digests already exist in both registries; this only writes the tag lists
          docker buildx imagetools create $targets $(printf "$IMAGE@sha256:%s " $(ls digests))
          docker buildx imagetools inspect "$IMAGE:${tags%% *}"
          docker buildx imagetools inspect "$GHCR_IMAGE:${tags%% *}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
